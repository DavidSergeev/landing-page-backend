AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Landing page personal AI assistant backend.
  Exposes a Lambda Function URL with RESPONSE_STREAM mode so Gemini tokens
  are forwarded to the browser as Server-Sent Events (SSE).

Parameters:
  GoogleApiKey:
    Type: String
    Default: /landing/gemini-api-key
    Description: SSM Parameter Store path for the Google Gemini API key

  GmailAddress:
    Type: String
    Default: /landing/gmail-address
    Description: SSM Parameter Store path for the Gmail address used to send meeting notifications

  GmailAppPassword:
    Type: String
    Default: /landing/gmail-app-password
    Description: SSM Parameter Store path for the Gmail app password used to send meeting notifications

  SysPromptVersion:
    Type: Number
    Default: "1"
    Description: >
      Version of the system prompt to load from DynamoDB.
      The Lambda will fetch the item with key "system_prompt_v<N>" from the config table.

  UseLocalSysPrompt:
    Type: String
    Default: "True"
    AllowedValues:
      - "True"
      - "False"
    Description: >
      When "True", the Lambda skips DynamoDB and uses the built-in
      DEFAULT_SYSTEM_PROMPT constant instead, ignoring SysPromptVersion.

  WorkerPrincipalArn:
    Type: String
    Description: >
      ARN of the IAM user/role whose access key + secret are stored as
      secrets in the landing-api-worker Cloudflare Worker. Granted
      lambda:InvokeFunctionUrl and lambda:InvokeFunction below so it's the
      only caller able to invoke the AWS_IAM-protected Function URL.

Globals:
  Function:
    # 60 s gives the model enough time to finish a long response
    Timeout: 60
    # 256 MB is sufficient; LangChain + Gemini client are lightweight
    MemorySize: 256

Resources:
  ChatFunction:
    Type: AWS::Serverless::Function
    # Container image build — `sam build` runs `docker build` against the
    # Dockerfile below instead of the zip/Makefile workflow. The AWS Lambda
    # Web Adapter binary is baked into the image (see Dockerfile) rather than
    # attached as a layer, so the same image also runs unmodified outside
    # Lambda (ECS/EKS/Fargate/local `docker run`).
    Metadata:
      Dockerfile: Dockerfile
      DockerContext: .
      DockerTag: latest
    Properties:
      FunctionName: landing-page-chat
      PackageType: Image
      Description: Streaming SSE chat handler powered by Gemini
      FunctionUrlConfig:
        # AWS_IAM restricts invocation to callers who can sign requests with
        # SigV4 — see ChatFunctionUrlInvokePermission / ChatFunctionInvokePermission
        # below. In front of the browser sits the landing-api-worker Cloudflare
        # Worker, which holds the only credentials allowed to sign these calls.
        AuthType: AWS_IAM
        # RESPONSE_STREAM allows the Lambda to push chunks as they arrive
        # instead of buffering the entire response
        InvokeMode: RESPONSE_STREAM
        # CORS is handled by the FastAPI app itself (see CORSMiddleware in main.py),
        # not here — the Function URL's own Cors config and app-level CORS headers
        # can't coexist without producing duplicate Access-Control-* headers on
        # actual (non-preflight) requests. Keeping it app-level also keeps CORS
        # working when this image runs outside Lambda (ECS/EKS/Fargate/local).
      Role: !GetAtt ChatFunctionRole.Arn
      Environment:
        Variables:
          GOOGLE_API_KEY_PATH: !Ref GoogleApiKey
          GMAIL_ADDRESS_PATH: !Ref GmailAddress
          GMAIL_APP_PASSWORD_PATH: !Ref GmailAppPassword
          CONFIG_TABLE_NAME: !Ref ConfigTable
          MEETINGS_TABLE_NAME: !Ref MeetingsTable
          SYS_PROMPT_VERSION: !Ref SysPromptVersion
          USE_LOCAL_SYS_PROMPT: !Ref UseLocalSysPrompt
          # Lambda Web Adapter configuration — must match FunctionUrlConfig.InvokeMode above.
          AWS_LWA_INVOKE_MODE: response_stream
      # Keep Lambda warm on free tier (optional — remove if you prefer cold starts)
      # Events:
      #   KeepWarm:
      #     Type: Schedule
      #     Properties:
      #       Schedule: rate(5 minutes)

  # AWS_IAM Function URLs require the calling principal to hold BOTH of these
  # permissions — granting only one of them results in a 403 AccessDeniedException.
  ChatFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatFunction
      Action: lambda:InvokeFunctionUrl
      Principal: !Ref WorkerPrincipalArn
      FunctionUrlAuthType: AWS_IAM

  ChatFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatFunction
      Action: lambda:InvokeFunction
      Principal: !Ref WorkerPrincipalArn
      # Restricts this grant to calls made through the function URL, so
      # WorkerPrincipalArn can't invoke the function any other way.
      InvokedViaFunctionUrl: true

  ChatFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ChatFunctionInlinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource:
                  - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleApiKey}
                  - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GmailAddress}
                  - Fn::Sub: arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GmailAppPassword}
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                Resource:
                  - !GetAtt ConfigTable.Arn
                  - !GetAtt MeetingsTable.Arn

  ConfigTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: landing-config
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: config_key
          AttributeType: S
      KeySchema:
        - AttributeName: config_key
          KeyType: HASH

  MeetingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: landing-meetings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: meeting_id
          AttributeType: S
        - AttributeName: scheduled_at
          AttributeType: S
      KeySchema:
        - AttributeName: meeting_id
          KeyType: HASH
        - AttributeName: scheduled_at
          KeyType: RANGE

Outputs:
  ChatFunctionUrl:
    Description: >
      Lambda Function URL (AuthType: AWS_IAM). Not directly browser-reachable —
      set it as LAMBDA_URL in landing-api-worker/wrangler.toml, which signs
      requests with WorkerPrincipalArn's credentials before forwarding them.
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  ChatFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt ChatFunction.Arn
